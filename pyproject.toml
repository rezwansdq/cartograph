[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograph"
version = "0.1.0"
description = "Collect place data from the web and turn it into interesting maps."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cartograph = "cartograph.cli:main"

[tool.setuptools.packages.find]
include = ["cartograph*"]
